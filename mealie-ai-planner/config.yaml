  mealie_token: ""
  openai_api_key: ""
  openai_model: "gpt-4o"
  location: "Lausanne, Suisse"
  default_planning_days: 7
  weekday_meals:
    - dinner
  weekend_meals:
    - lunch
    - dinner
  avoid_repeat_days: 14
schema:

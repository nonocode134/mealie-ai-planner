name: "Mealie AI Planner"
version: "1.0.0"
slug: "mealie_ai_planner"
description: "Génère des menus de repas avec l'IA en tenant compte des saisons, des recettes passées et de vos préférences"
url: "https://github.com/nonocode134/mealie-ai-planner"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Interface web Mealie AI Planner"
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:food
panel_title: "Mealie AI Planner"
options:
